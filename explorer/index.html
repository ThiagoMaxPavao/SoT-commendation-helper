<!DOCTYPE html>
<html>
<head>
  <title>Commendation Explorer</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <h1>Commendation Explorer</h1>
  <div id="update-info" style="margin-bottom: 18px;">
    <span id="last-updated"></span>
    &nbsp;|&nbsp;
    Update by visiting your
    <a href="https://www.seaofthieves.com/pt-br/profile/reputation" target="_blank" id="update-link">
      reputation page
    </a>
  </div>
  <div id="table-container">
    <table id="commendation-table">
      <thead>
        <tr>
          <th></th>
          <th>Name</th>
          <th>Description</th>
          <th>Location</th>
          <th>Campaign</th>
          <th>Completed</th>
          <th>Progress</th>
          <th>Grade</th>
        </tr>
      </thead>
      <tbody>
        <!-- rows will be injected by JS -->
      </tbody>
    </table>
  </div>

  <script src="index.js"></script>
</body>
</html>
